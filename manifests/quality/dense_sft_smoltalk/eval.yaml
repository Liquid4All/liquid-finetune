# Template used by the post-training comparison driver. The checkpoint and
# backend are replaced per artifact. IFEval is scored separately with its
# official rule registry; do not substitute a generic string metric.
checkpoint: CHECKPOINT
modality: text
evals:
  max_new_tokens: 512
  benchmarks:
    - name: gsm8k_250
      path: /shared/path/qat-quality/evals/gsm8k_250.parquet
      metric: gsm8k
      limit: 250
      max_new_tokens: 512
    - name: mmlu_balanced_500
      path: /shared/path/qat-quality/evals/mmlu_balanced_500.parquet
      metric: mcq_gen
      limit: 500
      max_new_tokens: 8
