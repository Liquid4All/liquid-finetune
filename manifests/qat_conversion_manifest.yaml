version: 3
checkpoint: /absolute/path/to/hf-checkpoint
artifacts_root: /shared/path/qat-artifacts
conversions:
  gguf_q4_0:
    platform: cpu_or_rocm
    command: leap-export-gguf {checkpoint} --quant Q4_0 --token-embedding-type F16 --output-dir {artifacts_root}/gguf_q4_0 --llama-cpp-dir {llama_cpp_dir}
    evaluation_backend: llama_cpp
  gguf_q8_0:
    platform: cpu_or_rocm
    command: leap-export-gguf {checkpoint} --quant Q8_0 --token-embedding-type F16 --output-dir {artifacts_root}/gguf_q8_0 --llama-cpp-dir {llama_cpp_dir}
    evaluation_backend: llama_cpp
  mlx_q4:
    platform: apple-silicon
    command: mlx_lm.convert --hf-path {checkpoint} --mlx-path {artifacts_root}/mlx_q4 --quantize --q-bits 4 --q-group-size 32 --q-mode affine
    status: pending_apple_hardware
  mlx_q8:
    platform: apple-silicon
    command: mlx_lm.convert --hf-path {checkpoint} --mlx-path {artifacts_root}/mlx_q8 --quantize --q-bits 8 --q-group-size 32 --q-mode affine
    status: pending_apple_hardware
  vllm_fp8:
    platforms: [nvidia_h100, nvidia_b200, rocm_mi300x, rocm_mi325x]
    command: python manifests/convert_vllm.py {checkpoint} {artifacts_root}/vllm_fp8 --profile vllm_fp8 --tool llmcompressor
    evaluation_command: vllm serve {artifacts_root}/vllm_fp8
    parity:
      cuda:
        activations: exact_dynamic_per_token_e4m3fn
        weights: exact_per_tensor_e4m3fn
      rocm_gfx94x:
        activations: exact_dynamic_per_tensor_e4m3fnuz
        weights: exact_per_tensor_e4m3fnuz
      packed_moe_weights: exact_per_expert_matrix
      status: exact_platform_native_online
  vllm_mxfp4:
    platforms: [nvidia_b200, rocm_mi350x, rocm_mi355x]
    nvidia_command: python manifests/convert_vllm.py {checkpoint} {artifacts_root}/vllm_mxfp4 --profile vllm_mxfp4 --tool llmcompressor
    nvidia_evaluation_command: vllm serve {artifacts_root}/vllm_mxfp4 --linear-backend flashinfer
    amd_requires: pip install amd-quark; set QUARK_LLM_PTQ_SCRIPT
    amd_command: python manifests/convert_vllm.py {checkpoint} {artifacts_root}/vllm_mxfp4 --profile vllm_mxfp4 --tool quark
    amd_evaluation_command: vllm serve {artifacts_root}/vllm_mxfp4 --quantization quark
    parity:
      weights: exact_e2m1_e8m0_group32
      activations: exact_dynamic_e2m1_e8m0_group32
      backend_requirement: pin_w4a4_backend
      h100: unsupported_native_w4a4
      mi325x: unsupported_dense_w4a4_no_rocm_linear_kernel
      status: pending_b200_and_mi35x_hardware
  vllm_mxfp8:
    platforms: [nvidia_b200, rocm_mi350x, rocm_mi355x]
    command: python manifests/convert_vllm.py {checkpoint} {artifacts_root}/vllm_mxfp8 --profile vllm_mxfp8 --tool llmcompressor
    evaluation_command: vllm serve {artifacts_root}/vllm_mxfp8
    parity:
      weights: exact_e4m3_e8m0_group32
      activations: exact_dynamic_e4m3_e8m0_group32
      h100: unsupported_native_w8a8
      mi325x: unsupported_native_mxfp8
      status: pending_b200_and_mi35x_hardware
  vllm_nvfp4:
    platforms: [nvidia_b200]
    requires: Blackwell SM100+ and llm-compressor NVFP4 support
    command: python manifests/convert_vllm.py {checkpoint} {artifacts_root}/vllm_nvfp4 --profile vllm_nvfp4 --tool llmcompressor --num-calib-data 512
    evaluation_command: vllm serve {artifacts_root}/vllm_nvfp4
    parity:
      weights: exact_e2m1_e4m3_group16_plus_fp32_tensor_scale
      activations: deterministic_current_tensor_scale_during_qat
      conversion: static_calibrated_tensor_scale
      transformer_engine_extras_not_simulated: [stochastic_rounding, random_hadamard_transform]
      h100: unsupported_native_nvfp4
      status: pending_b200_hardware
noise_evaluation:
  noise_q4: [gguf_q4_0, mlx_q4, vllm_mxfp4, vllm_nvfp4]
  noise_q8: [gguf_q8_0, mlx_q8, vllm_fp8, vllm_mxfp8]
record:
  required: [checkpoint_sha256, model_revision, dataset_revision, row_ids_sha256, seed, profile, conversion_tool_version, artifact_path, runtime_hardware, runtime_version, parity_status]
