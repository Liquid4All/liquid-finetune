version: 1
seed: 42
profiles:
  - gguf_q4_0
  - gguf_q8_0
  - mlx_q4
  - mlx_q8
  - vllm_fp8
  - vllm_mxfp4
  - noise_q4
  - noise_q8

# Dataset revisions and selected row IDs must be captured in the result record
# at launch time. GRPO uses HF generation because QAT+vLLM is intentionally rejected.
runs:
  - id: dense_sft
    config:
      model_name: LFM2-1.2B
      training_type: sft
      dataset:
        # Produced by quality/dense_sft_smoltalk/materialize_subset.py.
        path: /shared/path/qat-quality/datasets/smoltalk-smol-constraints/train_1000.parquet
        type: sft
        limit: 1000
        test_size: 0.1
      training_config:
        num_train_epochs: 1
        per_device_train_batch_size: 16
        per_device_eval_batch_size: 16
        gradient_accumulation_steps: 1
        learning_rate: 5.0e-5
        lr_scheduler_type: linear
        warmup_ratio: 0.1
        logging_steps: 5
        logging_first_step: true
        save_strategy: epoch
        eval_strategy: epoch
        data_seed: 42
        bf16: true
        max_length: 256
        deepspeed: false
        tracker: none
      peft_config:
        extends: DEFAULT_LORA
        use_peft: true
  - id: dense_dpo
    config:
      model_name: LFM2-1.2B
      training_type: dpo
      dataset: {path: mlabonne/orpo-dpo-mix-40k, type: dpo, subset: default, limit: 1000, test_size: 0.1}
      training_config: {extends: DEFAULT_DPO, num_train_epochs: 1, eval_strategy: epoch}
      peft_config: {extends: DEFAULT_LORA, use_peft: true}
  - id: dense_grpo
    config:
      model_name: LFM2-1.2B
      training_type: grpo
      dataset: {path: openai/gsm8k, type: grpo, subset: main, split: train, limit: 1000, test_size: 0.1}
      rewards: {recipe: tasks/gsm8k/recipe.py::GSM8KRecipe}
      training_config: {extends: DEFAULT_GRPO, max_steps: 100, use_vllm: false, save_strategy: steps, save_steps: 100}
  - id: vision_sft
    config:
      model_name: LFM2.5-VL-450M
      training_type: vlm_sft
      dataset: {path: alay2shah/example-vlm-sft-dataset, type: vlm_sft, limit: 1000, test_size: 0.1}
      training_config: {extends: DEFAULT_VLM_SFT, num_train_epochs: 1, eval_strategy: epoch}
      peft_config: {extends: DEFAULT_VLM_LORA, use_peft: true}
  - id: vision_dpo
    config:
      model_name: LFM2.5-VL-450M
      training_type: vlm_dpo
      dataset: {path: openbmb/RLAIF-V-Dataset, type: vlm_dpo, limit: 1000, test_size: 0.1}
      training_config: {extends: DEFAULT_VLM_DPO, num_train_epochs: 1, eval_strategy: epoch}
      peft_config: {extends: DEFAULT_VLM_LORA, use_peft: true}
  - id: vision_grpo
    config:
      model_name: LFM2.5-VL-450M
      training_type: vlm_grpo
      dataset: {path: Voxel51/RefCOCO, type: vlm_grpo, limit: 1000, test_size: 0.1}
      rewards: {recipe: tasks/vlm_grounding/recipe.py::VLMGroundingIoURecipe}
      training_config: {extends: DEFAULT_VLM_GRPO, max_steps: 100, use_vllm: false, beta: 0.01, save_strategy: steps, save_steps: 100}
      peft_config: {use_peft: false}
  - id: moe_sft
    config:
      model_name: LFM2-8B-A1B
      training_type: moe_sft
      dataset: {path: HuggingFaceTB/smoltalk, type: sft, subset: all, limit: 1000, test_size: 0.1}
      training_config: {extends: MOE_SFT, num_train_epochs: 1, eval_strategy: epoch}
      peft_config: {extends: MOE_LORA, use_peft: true}
  - id: moe_dpo
    config:
      model_name: LFM2-8B-A1B
      training_type: moe_dpo
      dataset: {path: mlabonne/orpo-dpo-mix-40k, type: dpo, subset: default, limit: 1000, test_size: 0.1}
      training_config: {extends: MOE_DPO, num_train_epochs: 1, eval_strategy: epoch}
      peft_config: {extends: MOE_LORA, use_peft: true}

evaluation:
  text: {gsm8k: 100, ifeval: 100, balanced_mmlu_mcqa: 100, heldout_loss: true}
  vision: {mmmu: 100, docvqa: 100, refcoco_grounding: 100}
  seeds_after_selection: 3
