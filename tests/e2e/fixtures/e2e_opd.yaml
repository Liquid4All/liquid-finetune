project_name: "e2e_opd"
model_name: "LFM2-350M"
training_type: "opd"

dataset:
  path: "trl-lib/DeepMath-103K"
  type: "grpo"
  limit: 16

training_config:
  extends: "DEFAULT_OPD"
  teacher_model_name_or_path: "LFM2-1.2B"
  max_steps: 4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  num_generations: 2
  max_length: 512
  max_completion_length: 16
  learning_rate: 1e-6
  save_strategy: "no"
  logging_steps: 1
  seed: 42

peft_config:
  use_peft: false
