# On-policy distillation (OPD): the student samples a completion for every
# prompt and is trained toward the teacher's next-token distribution on its own
# samples, with reverse KL by default.
#
# Rows may be prompt-only (`dataset.type: grpo`, the GRPO prompt contract) or
# conversations (`dataset.type: sft`), whose final assistant turn is dropped
# and regenerated by the student. Teacher and student must share a tokenizer.
#
# Launch:
#   uv run liquid-finetune job_configs/opd_example.yaml

project_name: "my_opd_project"
model_name: "LFM2-1.2B" # student, typically after SFT or off-policy KD
training_type: "opd"

dataset:
  path: "HuggingFaceTB/smoltalk"
  type: "sft"
  limit: 2000
  subset: "all"

training_config:
  extends: "DEFAULT_OPD"
  teacher_model_name_or_path: "LFM2-2.6B"
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1e-6
  max_length: 2048
  max_completion_length: 512
  num_generations: 1
  # 1.0 = reverse KL (default), 0.0 = forward KL, in between = JSD.
  beta: 1.0
  # Memory-saving top-k loss over the student's top tokens plus a tail bucket.
  # loss_top_k: 64

  # Student rollouts run in colocated vLLM by default. To serve them from a
  # dedicated GPU instead, switch to server mode and uncomment grpo_rollout.
  # vllm_mode: "server"
  # vllm_server_host: "auto"
  # vllm_server_port: 8000

# grpo_rollout:
#   server_gpus: 1
#   tensor_parallel_size: 1
#   gpu_memory_utilization: 0.9
