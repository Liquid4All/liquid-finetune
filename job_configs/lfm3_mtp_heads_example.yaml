# Train an MTP (multi-token prediction) head for an LFM3 model.
# First turn the checkpoint into an MTP start point:
#   liquid-prepare-mtp /path/to/lfm3-checkpoint ./checkpoints/lfm3-mtp --mode heads
# "heads" freezes the backbone, so the served model's own outputs do not change.
project_name: "my_lfm3_mtp_project"
model_name: "./checkpoints/lfm3-mtp"
training_type: "sft"

dataset:
  path: "HuggingFaceTB/smoltalk"
  type: "sft"
  limit: 1000
  test_size: 0.2
  subset: "all"

training_config:
  extends: "DEFAULT_SFT"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  learning_rate: 1e-4
  assistant_only_loss: true
