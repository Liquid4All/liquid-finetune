project_name: "lfm25_vlm_embedding"
model_name: "/home/shared_tw/pretrained/LFM2.5-VL-450M"
training_type: "vlm_embedding"

dataset:
  path: "/path/to/vlm_embedding_train.jsonl"
  type: "vlm_embedding"
  test_size: 0.05

training_config:
  extends: "DEFAULT_VLM_EMBEDDING"
  num_train_epochs: 1
  per_device_train_batch_size: 8
  learning_rate: 2e-5
  temperature: 0.02
  max_image_tokens: 256

peft_config:
  extends: "DEFAULT_VLM_LORA"
  use_peft: true
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
