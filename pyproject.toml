[project]
name = "liquid-finetune"
version = "0.1.0"
description = "A minimal fine-tuning repo for LFM2, fully built on Open Source."
readme = "README.md"
authors = [
    { name = "Liquid AI", email = "support@liquid.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "peft>=0.15.2",
    "deepspeed>=0.17.1; sys_platform == 'linux'",
    "torch>=2.10.0,<2.12.0",
    "transformers>=5.3.0,<5.4.0",
    "numpy>=2.4.1",
    "trl==1.9.0",
    "rich>=14.1.0",
    "pillow>=11.3.0",
    "mpi4py>=4.1.0; sys_platform == 'linux'",
    "wandb>=0.22.3",
    "ray==2.51.1",
    "pyyaml>=6.0",
    "turm>=0.13.0; sys_platform == 'linux'",
    "torchvision>=0.24.1",
    "modal>=0.73",
    "trackio>=0.3",
    "typer>=0.20.0",
    "kubernetes>=34.0.0",
    "pydantic>=2.0",
    "bitsandbytes>=0.48.0; sys_platform == 'linux'",
    "sentence-transformers>=5.3.0,<5.7.0",
    "pylate>=1.6.0,<1.7.0",
]

[project.optional-dependencies]
# OpenEnv RL environments — only needed if you use rl_env in your config.
# Install with: uv sync --extra rl-env
rl-env = [
    "openenv-core>=0.1; sys_platform == 'linux'",
]

[project.scripts]
liquid-finetune = "liquid_finetune:main"
liquid-export-manual-sharded-checkpoint = "liquid_finetune.cli.export_manual_sharded_checkpoint:main"
liquid-export-gguf = "liquid_finetune.cli.export_gguf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The default CUDA profile installs a pinned FA2 wheel. Model loading still
# probes the import at runtime and falls back to SDPA if FA2 is not usable.
no-build-isolation-package = ["flash-attn"]
default-groups = ["dev", "cuda", "flash-attn"]
environments = [
    "python_version == '3.12' and sys_platform == 'darwin'",
    "python_version == '3.12' and sys_platform == 'linux'",
]

# vLLM wheels can declare dependency ranges that lag the LFM Transformers /
# Hugging Face Hub stack. The override is intentional and covered by the GRPO
# smoke fixtures, which leave use_vllm enabled to match shipped defaults.
override-dependencies = [
    # Override so vLLM resolves with the LFM-validated Transformers 5.3 stack.
    "transformers>=5.3.0,<5.4.0",
    "huggingface_hub>=1.0",
    "numpy<2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "configs: config parsing, validation, override, filtering (no GPU)",
    "dense: dense model end-to-end training tests",
    "vlm: VLM end-to-end training tests",
    "moe: MoE end-to-end training tests",
    "retrieval: embedding and ColBERT end-to-end training tests",
    "single_gpu: local single-GPU end-to-end training tests",
]
addopts = "-v --tb=short"

[tool.ruff]
exclude = ["src/liquid_finetune/quantization/gguf"]

[dependency-groups]
cuda = [
    "liger-kernel>=0.6.2; sys_platform == 'linux'",
    # Keep CUDA vLLM pinned. FA2 is installed by default through the separate
    # flash-attn group so it can be disabled with `--no-group flash-attn`.
    "vllm==0.22.0; sys_platform == 'linux'",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "ruff>=0.11.13",
]
flash-attn = [
    # HF FA2 support for the default CUDA 13 / Torch 2.11 stack.
    # Model loading still probes the import at runtime and falls back to SDPA.
    "flash-attn @ https://github.com/adithyaxx/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu13torch2.11cxx11abiTRUE-cp312-cp312-linux_x86_64.whl#sha256=eea423825f3e12818b98b2078e2cb5ce6fe6b73d22612316d2a55fad4701938f; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
