[vlm_embedding]
description = "Native-dimension assistant-prefix contrastive adaptation for generative vision-language checkpoints."
mode = "adapter"
modality = "image"
command = "bash dittopilot/run_vlm_embedding.sh --checkpoint {{checkpoint_path}} --dataset {{dataset_path}} --output {{output_checkpoint_path}} --run-name {{run_name}} --learning-rate {{learning_rate}} --batch-size {{batch_size}} --micro-batch-size {{micro_batch_size}} --collate-workers {{collate_workers}} --collate-backend {{collate_backend}} --text-attn-implementation {{text_attn_implementation}} --cached-loss {{cached_loss}} --sort-rows {{sort_rows}} --retain-graphs {{retain_graphs}} --max-text-tokens {{max_text_tokens}} --gradient-accumulation-steps {{gradient_accumulation_steps}} --gradient-checkpointing {{gradient_checkpointing}} --gradient-checkpointing-scope {{gradient_checkpointing_scope}} --max-steps {{max_steps}} --temperature {{temperature}} --max-image-tokens {{max_image_tokens}} --min-image-tokens {{min_image_tokens}} --pooling {{pooling}} --lr-scheduler {{lr_scheduler}} --teacher-embeddings {{teacher_embeddings}} --distill-weight {{distill_weight}} --teacher-temperature {{teacher_temperature}} --lora-rank {{lora_rank}} --lora-alpha {{lora_alpha}} --warmup-ratio {{warmup_ratio}} --weight-decay {{weight_decay}} --save-steps {{save_steps}} --tracker {{tracker}} --seed {{seed}}"
gpus = 1
cpus = 32
nodes = 1
tasks_per_node = 1
memory = "256G"
time = "08:00:00"
needs_ray = false
slurm_partition = "gpuworker"

[vlm_embedding.args.learning_rate]
type = "float"
default = 1e-4
description = "Peak LoRA learning rate."

[vlm_embedding.args.batch_size]
type = "int"
default = 8192
description = "Global logical contrastive batch size used by one exact InfoNCE softmax; split evenly across data-parallel GPUs."

[vlm_embedding.args.micro_batch_size]
type = "int"
default = 32
description = "Maximum number of rows encoded at once during cached gradient replay; when it covers the per-device batch the cache pass is skipped."

[vlm_embedding.args.collate_workers]
type = "int"
default = 16
description = "Workers that load images and build micro-batches ahead of the accelerator during cached replay; 0 collates inline."

[vlm_embedding.args.text_attn_implementation]
type = "str"
default = "sdpa"
description = "Language-model attention: sdpa or flash_attention_2 (the SigLIP2 vision encoder always uses SDPA)."

[vlm_embedding.args.collate_backend]
type = "str"
default = "thread"
description = "Collation workers as threads in the training process (thread) or separate processes (process), which keep image preprocessing off the GIL that launches kernels."

[vlm_embedding.args.cached_loss]
type = "str"
default = "true"
description = "Use exact two-pass cached contrastive loss; true or false."

[vlm_embedding.args.sort_rows]
type = "str"
default = "true"
description = "Sort each rank's rows by image roles and text length before chunking to reduce padding; exact for the in-batch loss. true or false."

[vlm_embedding.args.retain_graphs]
type = "str"
default = "false"
description = "Keep every micro-batch's autograd graph and backpropagate the gathered loss once instead of replaying a cache pass; exact, trades HBM for one fewer forward. true or false."

[vlm_embedding.args.teacher_embeddings]
type = "str"
default = "none"
description = "Float16 [items, dim] .npy of L2-normalized teacher embeddings indexed by each row's teacher.{query,positive,negative}; none disables distillation."

[vlm_embedding.args.distill_weight]
type = "float"
default = 0.0
description = "Weight of KL(teacher || student) over in-batch candidate distributions, added to InfoNCE."

[vlm_embedding.args.teacher_temperature]
type = "float"
default = 0.02
description = "Softmax temperature applied to teacher similarities."

[vlm_embedding.args.lr_scheduler]
type = "str"
default = "linear"
description = "Learning-rate schedule after warmup: linear, cosine, or constant_with_warmup."

[vlm_embedding.args.min_image_tokens]
type = "int"
default = 64
description = "LFM2-VL processor lower bound on tokens per image tile; small images are upsampled to reach it."

[vlm_embedding.args.pooling]
type = "str"
default = "last"
description = "Sequence pooling for embeddings: last (final attended token) or mean (over attended tokens, matches vLLM MEAN)."

[vlm_embedding.args.max_text_tokens]
type = "int"
default = 512
description = "Truncate each role's text to this many tokens before templating; 0 disables truncation."

[vlm_embedding.args.gradient_accumulation_steps]
type = "int"
default = 1
description = "Must remain 1 for in-batch contrastive loss; use cached loss for larger effective batches."

[vlm_embedding.args.gradient_checkpointing]
type = "str"
default = "false"
description = "Whether to recompute backbone activations during backward; false is preferred when the physical batch fits in HBM."

[vlm_embedding.args.gradient_checkpointing_scope]
type = "str"
default = "auto"
description = "Activation-checkpointing scope: auto follows gradient_checkpointing; all, language, vision, or none selects the exact backbone scope."

[vlm_embedding.args.max_steps]
type = "int"
default = 80
description = "Logical-batch optimizer steps; approximately one pass over a 600k-row mixture at batch 8192."

[vlm_embedding.args.temperature]
type = "float"
default = 0.02
description = "InfoNCE softmax temperature."

[vlm_embedding.args.max_image_tokens]
type = "int"
default = 256
description = "Maximum image token budget per visual input."

[vlm_embedding.args.lora_rank]
type = "int"
default = 64
description = "LoRA rank."

[vlm_embedding.args.lora_alpha]
type = "int"
default = 64
description = "LoRA alpha."

[vlm_embedding.args.warmup_ratio]
type = "float"
default = 0.05
description = "Fraction of optimizer steps used for linear warmup."

[vlm_embedding.args.weight_decay]
type = "float"
default = 0.01
description = "AdamW weight decay."

[vlm_embedding.args.save_steps]
type = "int"
default = 10
description = "Checkpoint interval in optimizer steps."

[vlm_embedding.args.tracker]
type = "str"
default = "wandb"
description = "Experiment tracker; supported values are wandb and none."

[vlm_embedding.args.seed]
type = "int"
default = 20261019
description = "Pinned trainer and dataloader seed."
