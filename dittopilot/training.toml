[vlm_embedding]
description = "Native-dimension assistant-prefix contrastive adaptation for generative vision-language checkpoints."
mode = "adapter"
modality = "image"
command = "bash dittopilot/run_vlm_embedding.sh --checkpoint {{checkpoint_path}} --dataset {{dataset_path}} --output {{output_checkpoint_path}} --run-name {{run_name}} --learning-rate {{learning_rate}} --batch-size {{batch_size}} --gradient-accumulation-steps {{gradient_accumulation_steps}} --gradient-checkpointing {{gradient_checkpointing}} --gradient-checkpointing-scope {{gradient_checkpointing_scope}} --max-steps {{max_steps}} --temperature {{temperature}} --max-image-tokens {{max_image_tokens}} --lora-rank {{lora_rank}} --lora-alpha {{lora_alpha}} --warmup-ratio {{warmup_ratio}} --weight-decay {{weight_decay}} --save-steps {{save_steps}} --tracker {{tracker}} --seed {{seed}}"
gpus = 1
cpus = 16
nodes = 1
tasks_per_node = 1
memory = "256G"
time = "08:00:00"
needs_ray = false
slurm_partition = "gpuworker"

[vlm_embedding.args.learning_rate]
type = "float"
default = 1e-4
description = "Peak LoRA learning rate."

[vlm_embedding.args.batch_size]
type = "int"
default = 32
description = "Per-device contrastive batch size; all 32 rows share the in-batch candidate pool."

[vlm_embedding.args.gradient_accumulation_steps]
type = "int"
default = 1
description = "Must remain 1 for in-batch contrastive loss; use cached loss for larger effective batches."

[vlm_embedding.args.gradient_checkpointing]
type = "str"
default = "false"
description = "Whether to recompute backbone activations during backward; false is preferred when the physical batch fits in HBM."

[vlm_embedding.args.gradient_checkpointing_scope]
type = "str"
default = "auto"
description = "Activation-checkpointing scope: auto follows gradient_checkpointing; all, language, vision, or none selects the exact backbone scope."

[vlm_embedding.args.max_steps]
type = "int"
default = 3000
description = "Optimizer steps; 3000 is one pass over the 96k-row v1 mixture at effective batch 32."

[vlm_embedding.args.temperature]
type = "float"
default = 0.02
description = "InfoNCE softmax temperature."

[vlm_embedding.args.max_image_tokens]
type = "int"
default = 256
description = "Maximum image token budget per visual input."

[vlm_embedding.args.lora_rank]
type = "int"
default = 64
description = "LoRA rank."

[vlm_embedding.args.lora_alpha]
type = "int"
default = 64
description = "LoRA alpha."

[vlm_embedding.args.warmup_ratio]
type = "float"
default = 0.05
description = "Fraction of optimizer steps used for linear warmup."

[vlm_embedding.args.weight_decay]
type = "float"
default = 0.01
description = "AdamW weight decay."

[vlm_embedding.args.save_steps]
type = "int"
default = 500
description = "Checkpoint interval in optimizer steps."

[vlm_embedding.args.tracker]
type = "str"
default = "wandb"
description = "Experiment tracker; supported values are wandb and none."

[vlm_embedding.args.seed]
type = "int"
default = 20261019
description = "Pinned trainer and dataloader seed."
